name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q app.py storage.py sudoku.py
      - run: sh -n update.sh scripts/update.sh
      - run: docker build -t sudoku-app:test .
